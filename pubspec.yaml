name: midday_meal_system
description: "Face-Based Mid Day Meal System - Biometric meal management for schools"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.1
  http_parser: ^4.0.2
  
  # Camera
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  
  # QR Code Scanning
  mobile_scanner: ^5.1.1
  
  # Local storage
  shared_preferences: ^2.2.3
  
  # UI
  google_fonts: ^6.2.1
  
  # URL launcher (for Excel download)
  url_launcher: ^6.2.6
  
  # Date & Time
  intl: ^0.19.0
  
  # Permissions
  permission_handler: ^11.3.1

  # File picker (prescription uploads)
  file_picker: ^8.1.2

  # Charts (monthly report)
  fl_chart: ^0.69.0

  # Google Generative AI (Gemini)
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF6B00"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
